services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-actas}
      POSTGRES_USER: ${DB_USER:-actas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app_network

  backend:
    image: ${APP_IMAGE:-actas-entrega:latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-actas}
      DB_USER: ${DB_USER:-actas}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Define DJANGO_SECRET_KEY en .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      PORT: ${PORT:-8000}
      APP_ENV: production
      BACKUP_ROOT: /backups
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
      - ./backups:/backups
    networks:
      - app_network

  backup_scheduler:
    image: ${APP_IMAGE:-actas-entrega:latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      APP_ENV: production
      BACKUP_ROOT: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    command: ["sh", "/app/scripts/backup_scheduler.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    networks:
      - app_network

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  app_network:
    driver: bridge
