{% load static %}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ingreso | Synerjoy BPO</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>:root { --synerjoy-dark:#071d2d; --synerjoy-blue:#0d3b66; --synerjoy-cyan:#5bc0eb; --synerjoy-green:#3ecf8e; --synerjoy-danger:#c83c45; } body { min-height:100vh; display:grid; place-items:center; margin:0; background:var(--synerjoy-dark); font-family:Inter,Arial,sans-serif; } .login-card { width:min(430px,92vw); padding:2rem; border-radius:20px; box-shadow:0 24px 60px #0005; } .logo { width:76px;height:76px;border-radius:18px;background:var(--synerjoy-cyan);display:grid;place-items:center;color:var(--synerjoy-dark);font-size:2rem;font-weight:800;margin:auto; } .btn-primary { background:var(--synerjoy-blue); border-color:var(--synerjoy-blue); } .btn-primary:hover { background:var(--synerjoy-dark); border-color:var(--synerjoy-dark); }</style>
</head>
<body>
  <main class="login-card bg-white">
    <div class="logo">S</div>
    <p class="text-center text-uppercase text-secondary small fw-bold mt-3">Synerjoy BPO</p>
    <h1 class="h3 text-center">Actas de entrega</h1>
    {% for message in messages %}<div class="alert alert-warning" role="alert">{{ message }}</div>{% endfor %}
    {% if form.errors %}<div class="alert alert-danger">Usuario o contraseña incorrectos.</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="form-label" for="id_username">Usuario</label><input class="form-control form-control-lg" id="id_username" name="username" autocomplete="username" required value="{{ form.username.value|default:'' }}">
      <label class="form-label mt-3" for="id_password">Contraseña</label><input class="form-control form-control-lg" id="id_password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary w-100 mt-4" type="submit">Ingresar</button>
    </form>
  </main>
</body>
</html>
